name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'fabric-26.1.2-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: load release metadata
        shell: bash
        run: |
          minecraft_version="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)"
          mod_version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          release_tag="fabric-${minecraft_version}-v${mod_version}"
          jar_name="onlyzombiesspawn-fabric-${minecraft_version}-${mod_version}.jar"
          sources_jar_name="onlyzombiesspawn-fabric-${minecraft_version}-${mod_version}-sources.jar"

          {
            echo "minecraft_version=${minecraft_version}"
            echo "mod_version=${mod_version}"
            echo "release_tag=${release_tag}"
            echo "jar_name=${jar_name}"
            echo "sources_jar_name=${sources_jar_name}"
          } >> "${GITHUB_ENV}"

      - name: validate pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "${release_tag}" ]; then
            echo "Expected tag ${release_tag}, but got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: build
        run: ./gradlew clean build

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/${{ env.jar_name }}
            build/libs/${{ env.sources_jar_name }}
